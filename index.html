<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audi Showroom — Vorsprung durch Technik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000; --char:#111; --char2:#1a1a1a; --text:#f4f4f4; --mute:#8f8f8f; --line:rgba(255,255,255,.12);
  --red:#E00000; --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Inter','Roboto','Helvetica Neue',Arial,'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--black);color:var(--text);font-family:var(--font);font-weight:300;line-height:1.75;letter-spacing:.04em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--mute)}
.eyebrow::before{content:"";width:40px;height:1px;background:var(--red)}
h2.t{font-weight:200;font-size:clamp(2.1rem,5vw,4rem);line-height:1.12;letter-spacing:.06em;margin:20px 0 0}
.lead{max-width:540px;color:var(--mute);margin-top:22px}
.btn{display:inline-block;padding:17px 46px;border:1px solid rgba(255,255,255,.65);color:#fff;font:500 11px/1 var(--font);letter-spacing:.34em;text-transform:uppercase;background:transparent;cursor:pointer;transition:background .6s var(--ease),border-color .6s var(--ease),transform .6s var(--ease)}
.btn:hover{background:var(--red);border-color:var(--red);transform:translateY(-3px)}

/* HEADER (glass) */
.nav{position:fixed;inset:0 0 auto 0;height:76px;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,56px);
  background:rgba(8,8,8,.18);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid transparent;transition:background .7s var(--ease),height .7s var(--ease),border-color .7s}
.nav.scrolled{background:rgba(6,6,6,.7);height:62px;border-color:var(--line)}
.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:66px;height:auto}.logo span{font-weight:500;font-size:13px;letter-spacing:.55em}
.menu{display:flex;align-items:center;gap:clamp(22px,3.4vw,52px);list-style:none}
.menu a{position:relative;font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:#d6d6d6;padding:8px 0;transition:color .5s}
.menu a::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1px;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.menu a:hover
